name: Generate monthly reports
on:
  schedule:
    - cron: '17 1 5 * *'
    - cron: '17 1 15 * *'
    - cron: '17 1 25 * *'
  workflow_dispatch:
    inputs:
      report:
        description: '报告类型：模型 / 智能体 / 行业 / 全部'
        type: choice
        default: all
        options:
          - all
          - model
          - agent
          - industry
      month:
        description: '报告月份 YYYY-MM；留空生成上月，当月生成截至今天的初稿'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: monthly-reports
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select report
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_REPORT: ${{ inputs.report }}
        run: |
          case "$EVENT_SCHEDULE" in
            '17 1 5 * *') report=model ;;
            '17 1 15 * *') report=agent ;;
            '17 1 25 * *') report=industry ;;
            '') report="${INPUT_REPORT:-all}" ;;
            *) exit 1 ;;
          esac
          echo "REPORT_TYPE=$report" >> "$GITHUB_ENV"
      - name: Install PDF dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Generate reports with web search
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          REPORT_MONTH: ${{ inputs.month }}
        run: python scripts/generate_reports.py --month "$REPORT_MONTH" --report "$REPORT_TYPE"
      - name: Export PDF reports
        env:
          REPORT_MONTH: ${{ inputs.month }}
        run: python scripts/export_pdf.py --month "$REPORT_MONTH" --report "$REPORT_TYPE"
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: monthly-reports-${{ github.run_id }}
          path: reports/
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: generate monthly AI reports'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
